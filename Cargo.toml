[workspace]
resolver = "3"
members = [
    "crates/comrade-tool",
    "crates/comrade-tool-session",
    "crates/comrade-tool-fs",
    "crates/comrade-tool-git",
    "crates/comrade-tool-syntax",
    "crates/comrade-tool-project",
    "crates/comrade-tool-memory",
    "crates/comrade-tool-web",
    "crates/comrade-tool-skill",
    "crates/comrade-core",
    "crates/comrade-tool-mcp",
    "crates/comrade-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lilith/comrade"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
async-trait = "0.1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "io-util",
    "io-std",
    "process",
    "signal",
] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
ratatui = "0.29"
crossterm = "0.28"
arboard = "3"
unicode-width = "0.2"
tree-sitter = "0.25"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24"
