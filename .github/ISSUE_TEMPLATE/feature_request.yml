name: ✨ Feature request
description: Suggest a capability or improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! The most actionable requests state the problem
        first and the proposed solution second.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the need or friction, not the solution yet.
      placeholder: I'm always frustrated when ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like Comrade to do. Include commands, flags or UI sketches if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they fall short.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent loop / models
        - Tools (fs/ts/pom/git/web/memory)
        - TUI / UX
        - Packaging, install or release
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, related issues or prior art.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
