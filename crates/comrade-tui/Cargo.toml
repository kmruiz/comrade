[package]
name = "comrade-tui"
description = "Comrade cockpit: ratatui TUI + headless runner."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "comrade"
path = "src/main.rs"

[dependencies]
comrade-core = { path = "../comrade-core" }
comrade-tool = { path = "../comrade-tool" }
comrade-tool-session = { path = "../comrade-tool-session" }
comrade-tool-fs = { path = "../comrade-tool-fs" }
comrade-tool-git = { path = "../comrade-tool-git" }
comrade-tool-syntax = { path = "../comrade-tool-syntax" }
comrade-tool-project = { path = "../comrade-tool-project" }
comrade-tool-memory = { path = "../comrade-tool-memory" }
comrade-tool-web = { path = "../comrade-tool-web" }
comrade-tool-skill = { path = "../comrade-tool-skill" }
comrade-tool-mcp = { path = "../comrade-tool-mcp" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "io-std"] }
tokio-util.workspace = true
crossterm.workspace = true
ratatui.workspace = true
unicode-width.workspace = true
arboard.workspace = true
clap = { version = "4", features = ["derive"] }
